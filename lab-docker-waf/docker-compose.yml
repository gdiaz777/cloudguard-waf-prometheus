# Lab: CloudGuard WAF in Docker (single container, self-managed NGINX) + vulnerable app.
# Testing only. Not used in VMware: there the WAF is the VM.
name: waf-lab

services:
  appsec:
    image: checkpoint/cloudguard-appsec-standalone:latest
    container_name: appsec-agent
    # --nginx-self-managed => the profile has "I want to manage NGINX myself" ticked
    command: ["/cloudguard-appsec-standalone", "--token", "${APPSEC_TOKEN:?Set APPSEC_TOKEN in .env}", "--nginx-self-managed"]
    environment:
      - https_proxy=${HTTPS_PROXY:-}
    ports:
      - "80:80"
      - "443:443"
      - "7465:7465"   # Prometheus metrics (requires prometheus=true in the profile)
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d        # NGINX configuration (self-managed)
      - ./nginx/certs:/etc/nginx/certs:ro       # TLS certificate (scripts/gen-cert.sh)
      - ./agent/conf:/etc/cp/conf               # persistence: agent registration and policy
      - ./agent/data:/etc/cp/data
      - ./agent/logs:/var/log/nano_agent
    depends_on: [juiceshop]
    stdin_open: true
    tty: true
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    restart: unless-stopped
