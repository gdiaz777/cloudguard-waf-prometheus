# Reverse proxy protected by the WAF (--nginx-self-managed mode).
# Replace docker.example.com with the EXACT host of the asset in Infinity Portal:
# the WAF only treats requests arriving with that Host as that asset.

upstream juiceshop {
    server juiceshop:3000;
}

server {
    listen 80 default_server;
    server_name docker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name docker.example.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass         http://juiceshop;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
