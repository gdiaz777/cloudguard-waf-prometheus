# Reverse proxy protegido por el WAF (modo --nginx-self-managed).
# Sustituye docker.example.com por el host EXACTO del asset en Infinity Portal:
# el WAF solo trata como ese asset las peticiones que llegan con ese Host.

upstream juiceshop {
    server juiceshop:3000;
}

server {
    listen 80 default_server;
    server_name docker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name docker.example.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass         http://juiceshop;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
