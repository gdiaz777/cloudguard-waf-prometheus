global:
  scrape_interval: 15s       # matches the agent's internal cycle; do not lower it
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # CloudGuard WAF agent metrics (port 7465, enabled with prometheus=true in the profile).
  # Agents are listed in targets/waf-agents.yml; Prometheus re-reads the file by itself, no restart needed.
  - job_name: openappsec
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files: [/etc/prometheus/targets/waf-agents.yml]

  # OPTIONAL: per-asset statistics exporter (Infinity Portal API).
  # Empty by default; see docs/05-per-asset-api-exporter.md.
  - job_name: waf-api
    scrape_interval: 60s
    scrape_timeout: 50s
    file_sd_configs:
      - files: [/etc/prometheus/targets/waf-api.yml]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
