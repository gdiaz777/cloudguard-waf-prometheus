# Agentes CloudGuard WAF a monitorizar: <host>:7465
#
# IMPORTANTE: no uses la etiqueta "agent"; el agente ya la publica (su UUID) y se pisaría.
# Usa "gateway" para el nombre legible.

# --- WAF en Docker (laboratorio de este repo, puerto 7465 publicado en el host) ---
- targets: ["host.docker.internal:7465"]
  labels:
    gateway: lab-docker
    platform: docker

