# CloudGuard WAF agents to monitor: <host>:7465
#
# IMPORTANT: do not use the "agent" label; the agent already publishes it (its UUID) and it would be overwritten.
# Use "gateway" for the readable name.

# --- WAF in Docker (this repo's lab, port 7465 published on the host) ---
- targets: ["host.docker.internal:7465"]
  labels:
    gateway: lab-docker
    platform: docker

