groups:
  - name: cloudguard-waf
    rules:
      - alert: WafAgentMetricsDown
        expr: up{job="openappsec"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No metrics from WAF agent {{ $labels.instance }}"
          description: "Prometheus cannot read :7465. Agent down, cp-nano-prometheus service stopped or port filtered."

      - alert: WafDetectionSpike
        # IPS matches (detect + prevent) in 5 min per agent. Tune the threshold to the customer's baseline.
        expr: |
          sum by (gateway, agent) (
              sum_over_time(detect_action_matches_counter[5m])
            + sum_over_time(prevent_action_matches_counter[5m])
          ) > 500
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Detection spike on the WAF (gateway {{ $labels.gateway }})"
          description: "{{ $value }} IPS matches in the last 5 min."

      - alert: WafNanoServiceRestarts
        # The watchdog counter increases outside policy changes -> unstable service
        expr: |
          max by (gateway, agent) (max_over_time(nano_service_restarts_counter[15m]))
            - max by (gateway, agent) (max_over_time(nano_service_restarts_counter[15m] offset 15m)) > 0
        labels: {severity: warning}
        annotations:
          summary: "Nano-service restarts on gateway {{ $labels.gateway }}"

      - alert: WafApiExporterFailing
        expr: cpwaf_api_up == 0
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "The exporter cannot query the Infinity Portal API (credentials, region or connectivity)"
