# Monitoring stack for CloudGuard WAF: Prometheus + Grafana (+ optional API exporter).
# It is the same for a WAF in Docker or in VMware: the only difference is
# prometheus/targets/waf-agents.yml (which IP:7465 Prometheus connects to).
name: waf-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle          # allows reloading with: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # only used by the Docker lab
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  # OPTIONAL: per-asset statistics from the Infinity Portal API.
  # Only started with: docker compose --profile api up -d
  waf-api-exporter:
    build: ./waf-api-exporter
    image: waf-api-exporter
    container_name: waf-api-exporter
    profiles: [api]
    environment:
      - WAF_API_KEY=${WAF_API_KEY:?Set WAF_API_KEY in .env}
      - WAF_API_KEY_SECRET=${WAF_API_KEY_SECRET:?Set WAF_API_KEY_SECRET in .env}
      - WAF_API_GW=${WAF_API_GW:-https://cloudinfra-gw.portal.checkpoint.com}
    ports:
      - "9466:9466"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
