# Stack de monitorización para CloudGuard WAF: Prometheus + Grafana (+ exporter de API opcional).
# Es el mismo para un WAF en Docker o en VMware: lo único que cambia es
# prometheus/targets/waf-agents.yml (a qué IP:7465 se conecta Prometheus).
name: waf-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle          # permite recargar con: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # solo lo usa el laboratorio Docker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  # OPCIONAL: estadísticas por asset desde la API de Infinity Portal.
  # Se arranca solo con: docker compose --profile api up -d
  waf-api-exporter:
    build: ./waf-api-exporter
    image: waf-api-exporter
    container_name: waf-api-exporter
    profiles: [api]
    environment:
      - WAF_API_KEY=${WAF_API_KEY:?Define WAF_API_KEY en .env}
      - WAF_API_KEY_SECRET=${WAF_API_KEY_SECRET:?Define WAF_API_KEY_SECRET en .env}
      - WAF_API_GW=${WAF_API_GW:-https://cloudinfra-gw.portal.checkpoint.com}
    ports:
      - "9466:9466"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
